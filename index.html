<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Bean Coffee</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #4a2c1a 25%, #6b4423 50%, #8b5a2b 75%, #a67c52 100%);
            background-size: 400% 400%;
            color: #fff;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
            animation: gradientFlow 8s ease-in-out infinite;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }

        header {
            background: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            width: 100px;
            height: auto;
        }

        nav ul {
            list-style-type: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: #8b4513;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav ul li a:hover {
            background-color: #8b4513;
            color: #fff;
        }

        .mobile-menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 4px;
        }

        .mobile-menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: #8b4513;
            border-radius: 2px;
        }

        .hero {
            background-image: url('https://www.nescafe.com/gb/sites/default/files/2023-11/Untitled-2.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
            color: #fff;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(44, 24, 16, 0.7) 0%, rgba(107, 68, 35, 0.5) 50%, rgba(166, 124, 82, 0.3) 100%);
            animation: overlayShift 6s ease-in-out infinite;
        }

        @keyframes overlayShift {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.8; }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            animation: contentFloat 2s ease-out;
        }

        @keyframes contentFloat {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            margin-bottom: clamp(20px, 4vw, 30px);
            text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.8);
            animation: titleGlow 3s ease-in-out infinite alternate;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, #f4e4bc, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes titleGlow {
            from { 
                text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.8);
                transform: scale(1);
            }
            to { 
                text-shadow: 3px 3px 12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.5);
                transform: scale(1.02);
            }
        }

        .hero p {
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            margin-bottom: clamp(30px, 6vw, 40px);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            animation: textSlide 1.5s ease-out 0.5s both;
            font-weight: 300;
            line-height: 1.8;
            color: #f4e4bc;
        }

        @keyframes textSlide {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .btn {
            background: linear-gradient(135deg, #8b4513, #a0522d, #cd853f);
            color: #fff;
            padding: clamp(15px, 3vw, 20px) clamp(30px, 6vw, 40px);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            font-size: clamp(16px, 3vw, 18px);
            font-weight: 700;
            transition: all 0.4s ease;
            animation: buttonPulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes buttonPulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 8px 25px rgba(139, 69, 19, 0.4);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 12px 35px rgba(139, 69, 19, 0.6);
            }
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.8s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: linear-gradient(135deg, #a0522d, #cd853f, #daa520);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 15px 40px rgba(139, 69, 19, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            nav ul {
                position: static;
                flex-direction: column;
                padding: 0;
                transform: none;
                opacity: 1;
                background: none;
                box-shadow: none;
            }

            nav ul li {
                margin: 10px 0;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            .hero {
                padding: 40px 20px;
            }

            .hero-content {
                padding: 0 15px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: clamp(2.5rem, 8vw, 3rem);
            }

            .hero p {
                font-size: clamp(1rem, 3vw, 1.2rem);
            }

            .btn {
                padding: 15px 25px;
                font-size: 16px;
            }
        }

        /* Scroll animations */
        .scroll-animate {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .scroll-animate.animate {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.jpeg" alt="Fusion Bean Coffee Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about-us.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="mobile-menu-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="hero">
        <div class="hero-content">
            <h1>Welcome to Fusion Bean Coffee</h1>
            <p>Where Every Cup is a Masterpiece of Fusion</p>
            <a href="about-us.html" class="btn">Explore More</a>
        </div>
    </div>

    <script>
        // Mobile menu toggle
        const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
        const navMenu = document.querySelector('nav ul');

        mobileMenuToggle.addEventListener('click', () => {
            mobileMenuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Close mobile menu when clicking on a link
        document.querySelectorAll('nav ul li a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenuToggle.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });

        // Enhanced parallax effect for hero section
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const hero = document.querySelector('.hero');
            const heroContent = document.querySelector('.hero-content');
            
            hero.style.transform = `translateY(${scrolled * 0.3}px)`;
            heroContent.style.transform = `translateY(${scrolled * 0.1}px)`;
        });

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.scroll-animate').forEach(el => {
            observer.observe(el);
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Add ripple effect to buttons
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.classList.add('ripple');
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
</body>
</html>
