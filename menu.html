<!DOCTYPE html>

  <style>/* Basic styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    
    /* Header */
    header {
      background-color: #c89053;
      color: #503b27;
      padding: 20px;
      text-align: center;
      animation: headerAnimation 1s ease-in-out;
    }
    
    /* Animation for header */
    @keyframes headerAnimation {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    /* Main content */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      animation: contentAnimation 1s ease-in-out;
    }
    
    /* Animation for main content */
    @keyframes contentAnimation {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    /* Menu section */
    #menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      grid-gap: 20px;
    }
    
    /* Menu item */
    .menu-item {
      background-color: #fff;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: itemAnimation 1s ease-in-out;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    
    @keyframes itemAnimation {
      0% {
        transform: translateY(100%);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .menu-item {
      animation-delay: calc(var(--i) * 0.1s);
    }
    
    .menu-item img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    
    .menu-item h3 {
      margin: 0;
      color: #411f00;
      font-size: 1.2rem;
    }
    
    .menu-item p {
      margin: 5px 0;
      color: #411f00;
    }
    
    /* Container for the centered text */
    .centered-text {
      text-align: center;
      position: relative;
      margin: 20px 0;
    }
    
  /* Styling the hr element */
  hr.styled-hr {
    border: none;
    height: 1px;
    background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.75), rgba(0,0,0,0));
    width: 40%; /* Adjust the width of the line */
    display: inline-block;
    margin: 0 10px; /* Adjust the spacing between the line and text */
  }
        .back-arrow { position: fixed; top: 20px; left: 20px; font-size: 30px; color: #503b27; text-decoration: none; }
    </style>
</head>
